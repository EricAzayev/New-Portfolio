<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FocusTube logo preview</title>
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff; color: #24313B; }
  section { padding: 2.5rem; }
  section.dark { background: #24313B; color: #EAF1E9; }
  section.gray { background: #97A5AE; }
  h2 { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; margin: 0 0 1.25rem; text-transform: uppercase; }
  .row { display: flex; align-items: flex-end; gap: 2rem; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .cell span { font-size: 0.7rem; opacity: 0.7; }
  /* toolbar reality check: the exact chrome contexts */
  .toolbar { display: inline-flex; align-items: center; gap: 6px; background: #f1f3f4; padding: 8px 10px; border-radius: 999px; }
  .toolbar.war { background: #292a2d; }
</style>
</head>
<body>

<section>
  <h2>Mark — sizes</h2>
  <div class="row">
    <div class="cell"><img src="focustube-mark.svg" width="128"><span>128</span></div>
    <div class="cell"><img src="focustube-mark.svg" width="64"><span>64</span></div>
    <div class="cell"><img src="focustube-mark.svg" width="32"><span>32</span></div>
    <div class="cell"><img src="focustube-mark.svg" width="16"><span>16</span></div>
  </div>
</section>

<section class="dark">
  <h2>Mark — dark context + toolbar reality</h2>
  <div class="row">
    <div class="cell"><img src="focustube-mark.svg" width="64"><span>64</span></div>
    <div class="cell"><div class="toolbar"><img src="focustube-mark-icon.svg" width="16"><img src="focustube-mark.svg" width="16"><span style="font-size:12px;color:#e8eaed">FocusTube</span></div><span>light toolbar</span></div>
    <div class="cell"><div class="toolbar war"><img src="focustube-mark-icon.svg" width="16"><img src="focustube-mark.svg" width="16"><span style="font-size:12px;color:#e8eaed">FocusTube</span></div><span>dark toolbar</span></div>
  </div>
</section>

<section class="gray">
  <h2>Monochrome survival test (single color)</h2>
  <div class="row">
    <div class="cell">
      <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g fill="#1F2933">
          <circle cx="7" cy="21.5" r="5"/><circle cx="4.5" cy="31" r="4.5"/><circle cx="12" cy="30" r="12"/>
          <circle cx="57" cy="21.5" r="5"/><circle cx="59.5" cy="31" r="4.5"/><circle cx="52" cy="30" r="12"/>
          <circle cx="32" cy="33" r="16.5"/>
          <rect x="25" y="27" width="5.5" height="16" rx="2.75"/><rect x="33.5" y="27" width="5.5" height="16" rx="2.75"/>
        </g>
      </svg>
      <span>ink only</span>
    </div>
    <div class="cell"><img src="focustube-mark-icon.svg" width="64"><span>icon tile</span></div>
  </div>
</section>

</body>
</html>
